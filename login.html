<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__BRAND__</title>
<script>try{var p=JSON.parse(localStorage.getItem('wah-prefs')||'{}');if(p.theme&&p.theme!=='auto')document.documentElement.dataset.theme=p.theme}catch(e){}</script>
<style>:root{--bg:#f0f2f5;--panel:#fff;--fg:#111b21;--muted:#667781;--line:#e3e6e8;--accent:#128c7e;--accent-fg:#fff;--danger:#d64550;--field:#f5f6f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141a;--panel:#111b21;--fg:#e9edef;--muted:#8696a0;--line:#2a3942;--accent:#00a884;--accent-fg:#fff;--danger:#f15c6d;--field:#202c33}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b141a;--panel:#111b21;--fg:#e9edef;--muted:#8696a0;--line:#2a3942;--accent:#00a884;--accent-fg:#fff;--danger:#f15c6d;--field:#202c33}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
h1{font-size:21px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 22px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:inherit;font:inherit;outline:none}
input:focus{border-color:var(--accent)}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:8px;padding:10px 16px;background:var(--accent);color:var(--accent-fg);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.btn.full{width:100%;margin-top:20px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.err{color:var(--danger);font-size:13px;min-height:20px;margin-top:12px}
.hint{color:var(--muted);font-size:12px;margin-top:6px}</style>
<div class="center">
  <form class="box" id="f">
    <h1 data-egg>__BRAND__</h1>
    <p class="sub">Sign in to your WhatsApp.</p>
    <label for="u">Username</label>
    <input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" required>
    <button class="btn full" id="go">Sign in</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({username: u.value, password: p.value})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Sign in failed');
    location.href = d.redirect;
  } catch (x) { err.textContent = x.message; go.disabled = false; }
});
</script>

<style>
#egg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:999;padding:20px;animation:eggIn .25s}
#egg .card{position:relative;background:var(--panel,#fff);color:var(--fg,#111b21);border-radius:20px;padding:30px 26px 22px;max-width:340px;width:100%;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.45);animation:eggPop .55s cubic-bezier(.2,1.6,.4,1)}
#egg .wave{font-size:56px;line-height:1;display:inline-block;transform-origin:70% 70%;animation:eggWave 1.4s ease-in-out infinite}
#egg .tag{display:inline-block;margin:12px 0 2px;padding:3px 12px;border-radius:12px;background:var(--accent,#00a884);color:#fff;font:700 11px/1.6 system-ui,sans-serif;letter-spacing:1.5px}
#egg h2{margin:4px 0 2px;font-size:28px;letter-spacing:.5px}
#egg .role{margin:0 0 14px;color:var(--muted,#667781);font-size:14px}
#egg .quip{margin:0;padding:12px 14px;border-radius:12px;background:var(--field,#f0f2f5);font-size:14px;line-height:1.45}
#egg .stats{display:flex;justify-content:center;gap:18px;margin:14px 0 4px;font-size:12px;color:var(--muted,#667781)}
#egg .stats b{display:block;font-size:17px;color:var(--fg,#111b21)}
#egg small{display:block;margin-top:12px;color:var(--muted,#667781);font-size:11px}
.egg-bit{position:fixed;top:-40px;z-index:1000;pointer-events:none;font-size:22px;animation:eggFall linear forwards}
@keyframes eggIn{from{opacity:0}}
@keyframes eggPop{from{transform:scale(.55) rotate(-4deg);opacity:0}}
@keyframes eggWave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}}
@keyframes eggFall{to{transform:translateY(112vh) rotate(var(--r,540deg))}}
@media (prefers-reduced-motion:reduce){#egg,#egg .card,#egg .wave{animation:none}}
</style>
<script>
(() => {
  const QUIPS = [
    'Apa yang Diatas? Literally "what\'s above"… as in <b>what\'s up</b>. You\'re welcome 😏',
    'Survived: 405s, 428s, LIDs and 14 release candidates.',
    'Fuelled by ☕, powered by stubbornness, debugged at 2am.',
    'Commit history includes a message that just says <i>"please work god"</i>. It worked.',
    'No messages were harmed in the making of this app. A few were decrypted late.',
    'Fun fact: this whole thing runs without a single browser on the server.',
    'If you\'re reading this, you have excellent taste in secret combinations.',
  ];
  const KONAMI = ['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];
  const WORD = 'hanzel';
  let k = 0, typed = '', last = 0;

  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const bits = ['🎉','✨','💬','⬆️','🟢','💚','🚀','👋'];
    for (let i = 0; i < 46; i++) {
      const s = document.createElement('span');
      s.className = 'egg-bit';
      s.textContent = bits[Math.random() * bits.length | 0];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.fontSize = 14 + Math.random() * 20 + 'px';
      s.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg');
      s.style.animationDuration = 2.2 + Math.random() * 2.4 + 's';
      s.style.animationDelay = Math.random() * .6 + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 5600);
    }
  }

  function show() {
    if (document.getElementById('egg')) return;
    let found = 1, first = Date.now();
    try {
      const st = JSON.parse(localStorage.getItem('wah-egg') || '{}');
      found = (st.found || 0) + 1; first = st.first || first;
      localStorage.setItem('wah-egg', JSON.stringify({found, first}));
    } catch (e) {}
    const days = Math.max(0, Math.floor((Date.now() - first) / 864e5));
    const quip = QUIPS[Math.random() * QUIPS.length | 0];
    const d = document.createElement('div');
    d.id = 'egg';
    d.innerHTML = `<div class="card" role="dialog" aria-label="Developer">
      <div class="wave">👋</div>
      <div class="tag">DEVELOPER</div>
      <h2>Hanzel</h2>
      <p class="role">Creator of Apa yang Diatas (Whats Up)</p>
      <p class="quip">${quip}</p>
      <div class="stats"><span><b>${found}</b>time${found === 1 ? '' : 's'} found</span><span><b>${days}</b>day${days === 1 ? '' : 's'} since first</span></div>
      <small>You found the secret. Tap anywhere to close.</small>
    </div>`;
    d.addEventListener('click', () => d.remove());
    document.body.appendChild(d);
    confetti();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { document.getElementById('egg')?.remove(); return; }
    const key = (e.key || '').toLowerCase();
    k = key === KONAMI[k] ? k + 1 : (key === KONAMI[0] ? 1 : 0);
    if (k === KONAMI.length) { k = 0; show(); return; }
    // typing the name, but not while writing in a text box
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)) return;
    if (key.length === 1) {
      typed = (Date.now() - last > 2000 ? '' : typed) + key; last = Date.now();
      if (typed.endsWith(WORD)) { typed = ''; show(); }
    }
  });

  // phones: tap the title 7 times within 3 seconds
  let taps = 0, t0 = 0;
  document.querySelectorAll('[data-egg]').forEach((el) => el.addEventListener('click', () => {
    const now = Date.now();
    if (now - t0 > 3000) { taps = 0; t0 = now; }
    if (++taps >= 7) { taps = 0; show(); }
  }));
})();
</script>
