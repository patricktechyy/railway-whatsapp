<body>
<main class="auth">
  <section class="auth-brand" aria-label="__BRAND__">
    <div class="bubbles" aria-hidden="true">
      <i style="left:12%;--s:46px;--d:7s;--w:.1s;--h:-78vh"></i>
      <i style="left:34%;--s:28px;--d:6s;--w:.6s;--h:-64vh"></i>
      <i style="left:58%;--s:60px;--d:8s;--w:.3s;--h:-86vh"></i>
      <i style="left:78%;--s:34px;--d:6.5s;--w:1s;--h:-70vh"></i>
      <i style="left:88%;--s:22px;--d:5.5s;--w:1.4s;--h:-58vh"></i>
    </div>
    <span class="mark"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#f3f7f5" d="M15 3.5 L22.5 13 H33 A11 11 0 0 1 44 24 V31 A11 11 0 0 1 33 42 H15 A11 11 0 0 1 4 31 V24 A11 11 0 0 1 11.5 13.4 Z"/><path d="M16 31.5 24 23.5 32 31.5" fill="none" stroke="#17805a" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <div class="spacer"></div>
    <div>
      <h1 class="word" data-egg>Apa yang Diatas<small>Whats Up</small></h1>
      <p class="tag">Solusi buat anak IPLU. </p>
    </div>
    <div class="foot">HIDUP IPEKA!! Made with love by Hanzel</div>
  </section>
  <section class="auth-main">
    <form class="auth-form" id="f" novalidate>
      <h1>Sign in</h1>
      <p class="lede">Use the username and password you chose when you set up your account.</p>
      <label class="field"><span>Username</span>
        <input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
      <label class="field"><span>Password</span>
        <span class="input-wrap"><input id="p" type="password" autocomplete="current-password" required>
        <button type="button" class="reveal" data-reveal="p" aria-label="Show password">Show</button></span></label>
      <button class="btn lg full" id="go">Sign in</button>
      <div class="error" id="err" role="alert"></div>
      <p class="aside">Forgot your password? Ask the admins for a reset link.</p>
    </form>
  </section>
</main>
<div id="toast"></div>
<script>
document.querySelectorAll('[data-reveal]').forEach(b => b.addEventListener('click', () => {
  const i = document.getElementById(b.dataset.reveal), show = i.type === 'password';
  i.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show';
  b.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); i.focus();
}));
</script>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const usernameInput = document.getElementById('u');
  const passwordInput = document.getElementById('p');
  const go = document.getElementById('go');
  const err = document.getElementById('err');
  go.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({
        username: String(usernameInput.value ?? ''),
        password: String(passwordInput.value ?? '')
      })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Sign in failed');
    location.href = d.redirect;
  } catch (x) { err.textContent = x.message; go.disabled = false; }
});
</script>

<style>
#egg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:999;padding:20px;animation:eggIn .25s}
#egg .card{position:relative;background:var(--panel,#fff);color:var(--fg,#111b21);border-radius:20px;padding:30px 26px 22px;max-width:340px;width:100%;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.45);animation:eggPop .55s cubic-bezier(.2,1.6,.4,1)}
#egg .wave{font-size:56px;line-height:1;display:inline-block;transform-origin:70% 70%;animation:eggWave 1.4s ease-in-out infinite}
#egg .tag{display:inline-block;margin:12px 0 2px;padding:3px 12px;border-radius:12px;background:var(--accent,#00a884);color:#fff;font:700 11px/1.6 system-ui,sans-serif;letter-spacing:1.5px}
#egg h2{margin:4px 0 2px;font-size:28px;letter-spacing:.5px}
#egg .role{margin:0 0 14px;color:var(--muted,#667781);font-size:14px}
#egg .quip{margin:0;padding:12px 14px;border-radius:12px;background:var(--field,#f0f2f5);font-size:14px;line-height:1.45}
#egg .stats{display:flex;justify-content:center;gap:18px;margin:14px 0 4px;font-size:12px;color:var(--muted,#667781)}
#egg .stats b{display:block;font-size:17px;color:var(--fg,#111b21)}
#egg small{display:block;margin-top:12px;color:var(--muted,#667781);font-size:11px}
.egg-bit{position:fixed;top:-40px;z-index:1000;pointer-events:none;font-size:22px;animation:eggFall linear forwards}
@keyframes eggIn{from{opacity:0}}
@keyframes eggPop{from{transform:scale(.55) rotate(-4deg);opacity:0}}
@keyframes eggWave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}}
@keyframes eggFall{to{transform:translateY(112vh) rotate(var(--r,540deg))}}
@media (prefers-reduced-motion:reduce){#egg,#egg .card,#egg .wave{animation:none}}
</style>
<script>
(() => {
  const QUIPS = [
    'Apa yang Diatas? Literally "what\'s above"… as in **what\'s up**. You\'re welcome 😏',
    'Survived: 405s, 428s, LIDs and 14 release candidates.',
    'Fuelled by ☕, powered by stubbornness, debugged at 2am.',
    'Commit history includes a message that just says *"please work god"*. It worked.',
    'No messages were harmed in the making of this app. A few were decrypted late.',
    'Fun fact: this whole thing runs without a single browser on the server.',
    'If you\'re reading this, you have excellent taste in secret combinations.',
  ];
  const KONAMI = ['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];
  const WORD = 'hanzel';
  // messages the admin edits on the admin page; the list above is the fallback
  let remote = null;
  fetch('/api/easter-egg').then(r => r.json()).then(d => { if (Array.isArray(d.messages) && d.messages.length) remote = d.messages; }).catch(() => {});
  const fmt = (t) => String(t)
    .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
  let k = 0, typed = '', last = 0;

  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const bits = ['🎉','✨','💬','⬆️','🟢','💚','🚀','👋'];
    for (let i = 0; i < 46; i++) {
      const s = document.createElement('span');
      s.className = 'egg-bit';
      s.textContent = bits[Math.random() * bits.length | 0];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.fontSize = 14 + Math.random() * 20 + 'px';
      s.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg');
      s.style.animationDuration = 2.2 + Math.random() * 2.4 + 's';
      s.style.animationDelay = Math.random() * .6 + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 5600);
    }
  }

  function show() {
    if (document.getElementById('egg')) return;
    let found = 1, first = Date.now();
    try {
      const st = JSON.parse(localStorage.getItem('wah-egg') || '{}');
      found = (st.found || 0) + 1; first = st.first || first;
      localStorage.setItem('wah-egg', JSON.stringify({found, first}));
    } catch (e) {}
    const days = Math.max(0, Math.floor((Date.now() - first) / 864e5));
    const pool = remote || QUIPS;
    const quip = fmt(pool[Math.random() * pool.length | 0]);
    const d = document.createElement('div');
    d.id = 'egg';
    d.innerHTML = `<div class="card" role="dialog" aria-label="Developer">
      <div class="wave">👋</div>
      <div class="tag">DEVELOPER</div>
      <h2>Hanzel</h2>
      <p class="role">Creator of Apa yang Diatas</p>
      <p class="quip">${quip}</p>
      <div class="stats"><span><b>${found}</b>time${found === 1 ? '' : 's'} found</span><span><b>${days}</b>day${days === 1 ? '' : 's'} since first</span></div>
      <small>You found the secret. Tap anywhere to close.</small>
    </div>`;
    d.addEventListener('click', () => d.remove());
    document.body.appendChild(d);
    confetti();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { document.getElementById('egg')?.remove(); return; }
    const key = (e.key || '').toLowerCase();
    k = key === KONAMI[k] ? k + 1 : (key === KONAMI[0] ? 1 : 0);
    if (k === KONAMI.length) { k = 0; show(); return; }
    // typing the name, but not while writing in a text box
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)) return;
    if (key.length === 1) {
      typed = (Date.now() - last > 2000 ? '' : typed) + key; last = Date.now();
      if (typed.endsWith(WORD)) { typed = ''; show(); }
    }
  });

  // phones: tap the title 7 times within 3 seconds
  let taps = 0, t0 = 0;
  document.querySelectorAll('[data-egg]').forEach((el) => el.addEventListener('click', () => {
    const now = Date.now();
    if (now - t0 > 3000) { taps = 0; t0 = now; }
    if (++taps >= 7) { taps = 0; show(); }
  }));
})();
</script>
